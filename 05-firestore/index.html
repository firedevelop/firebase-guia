<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tareas Firestore | Booking App</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; background-color: #f0f2f5; padding-top: 50px; }
        .container { width: 400px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Formulario */
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button#btn-add { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        
        /* Filtros */
        .filters { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .filter-btn { background: #eee; border: none; padding: 5px 15px; border-radius: 15px; cursor: pointer; font-size: 0.9rem; }
        .filter-btn.active { background: #2c3e50; color: white; }

        /* Lista */
        ul { list-style: none; padding: 0; }
        li { background: #fff; border-bottom: 1px solid #eee; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; color: white; }
        .bg-trabajo { background-color: #e67e22; }
        .bg-personal { background-color: #27ae60; }
        .btn-delete { color: red; cursor: pointer; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mis Tareas</h2>

        <div class="input-group">
            <input type="text" id="task-input" placeholder="Nueva tarea...">
            <select id="category-select">
                <option value="Personal">Personal</option>
                <option value="Trabajo">Trabajo</option>
            </select>
            <button id="btn-add">+</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="todos">Todos</button>
            <button class="filter-btn" data-filter="Trabajo">Trabajo</button>
            <button class="filter-btn" data-filter="Personal">Personal</button>
        </div>

        <ul id="task-list"></ul>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
